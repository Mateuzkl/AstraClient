name: Content validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/content-validation.yml'
      - 'data/**'
      - 'layouts/**'
      - 'mods/**'
      - 'modules/**'
      - 'init.lua'
  pull_request:
    paths:
      - '.github/workflows/content-validation.yml'
      - 'data/**'
      - 'layouts/**'
      - 'mods/**'
      - 'modules/**'
      - 'init.lua'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit

      - name: Validate Lua syntax
        run: |
          luajit -b init.lua /dev/null
          find modules mods data -type f -name '*.lua' -print0 | xargs -0 -I{} luajit -b '{}' /dev/null

      - name: Validate package tree
        shell: bash
        run: |
          test -f init.lua || { echo "::error::missing package entry point: init.lua"; exit 1; }
          for root in data layouts mods modules; do
            test -d "$root" || { echo "::error::missing package root: $root"; exit 1; }
            test ! -d "$root/$root" || { echo "::error::nested duplicate package root: $root/$root"; exit 1; }
          done

      - name: Test DAT/SPR asset lifecycle
        run: |
          luajit - modules/game_things/things.lua <<'LUA'
          local thingsScript = assert(arg[1], 'missing things.lua path')
          local state

          local function reset(overrides)
            state = {
              version = 860,
              protocolVersion = 860,
              generation = 1,
              features = {},
              datLoaded = false,
              sprLoaded = false,
              datResults = { true },
              sprResults = { true },
              datCalls = 0,
              sprCalls = 0,
              otmlCalls = 0,
              versionChanges = {}
            }
            for key, value in pairs(overrides or {}) do
              state[key] = value
            end

            GameSpritesU32 = 1
            GameIdleAnimations = 2
            GameEnhancedAnimations = 3
            tr = string.format
            resolvepath = function(path) return path end
            g_logger = { info = function() end, error = function() end }
            g_settings = { getNode = function() return state.settings end }
            g_resources = {
              getGeneration = function() return state.generation end,
              fileExists = function(path) return state.modernOtfi and path:sub(-5) == '.otfi' end,
              readFileContents = function() return state.modernOtfi and 'frame-groups: true' or nil end
            }
            g_game = {
              getClientVersion = function() return state.version end,
              getProtocolVersion = function() return state.protocolVersion end,
              setClientVersion = function(version)
                state.version = version
                state.versionChanges[#state.versionChanges + 1] = version
              end,
              setProtocolVersion = function(version) state.protocolVersion = version end,
              enableFeature = function(feature) state.features[feature] = true end,
              getFeature = function(feature) return state.features[feature] == true end
            }
            g_things = {
              isDatLoaded = function() return state.datLoaded end,
              loadDat = function()
                state.datCalls = state.datCalls + 1
                local result = table.remove(state.datResults, 1)
                if result == nil then result = true end
                state.datLoaded = result
                return result
              end,
              loadOtml = function()
                state.otmlCalls = state.otmlCalls + 1
                return true
              end
            }
            g_sprites = {
              isLoaded = function() return state.sprLoaded end,
              loadSpr = function()
                state.sprCalls = state.sprCalls + 1
                local result = table.remove(state.sprResults, 1)
                if result == nil then result = true end
                state.sprLoaded = result
                return result
              end
            }
            assert(loadfile(thingsScript))()
          end

          local function assertEqual(actual, expected, message)
            assert(actual == expected, string.format('%s: expected %s, got %s', message, expected, actual))
          end

          local function testSameIdentityIsReused()
            reset()
            g_game.enableFeature(GameSpritesU32)
            load()
            state.features = {}
            load()
            assertEqual(state.datCalls, 1, 'same identity DAT reuse')
            assertEqual(state.sprCalls, 1, 'same identity SPR reuse')
            assertEqual(state.features[GameSpritesU32], true, 'U32 feature restored on reuse')

            for _ = 1, 20 do load() end
            assertEqual(state.datCalls, 1, 'repeated relog DAT reuse')
            assertEqual(state.sprCalls, 1, 'repeated relog SPR reuse')
          end

          local function testU16CacheIsInvalidatedForU32()
            reset()
            load()
            state.features[GameSpritesU32] = true
            load()
            assertEqual(state.datCalls, 2, 'U16 cache invalidated when U32 is required')
            assertEqual(state.sprCalls, 2, 'SPR reloaded when U32 is required')
          end

          local function testPathAndNativeInvalidationReload()
            reset()
            load()
            state.settings = { data = '1098/Tibia', sprites = '1098/Tibia' }
            load()
            assertEqual(state.datCalls, 2, 'path change reloads DAT')
            assertEqual(state.sprCalls, 2, 'path change reloads SPR')
            assertEqual(state.versionChanges[1], 1098, 'temporary asset version applied')
            assertEqual(state.versionChanges[2], 860, 'client version restored')

            state.settings = nil
            load()
            state.sprLoaded = false
            load()
            assertEqual(state.datCalls, 4, 'native invalidation reloads DAT')
            assertEqual(state.sprCalls, 4, 'native invalidation reloads SPR')
          end

          local function testModuleAndResourceReloads()
            reset()
            load()
            assert(loadfile(thingsScript))()
            load()
            assertEqual(state.datCalls, 2, 'module reload rejects stale DAT identity')
            assertEqual(state.sprCalls, 2, 'module reload rejects stale SPR identity')

            state.generation = state.generation + 1
            load()
            assertEqual(state.datCalls, 3, 'resource remount invalidates DAT')
            assertEqual(state.sprCalls, 3, 'resource remount invalidates SPR')
          end

          local function testFailedLoadIsNotCached()
            reset({ datResults = { false, false, true }, sprResults = { true, true } })
            load()
            assertEqual(isLoaded(), false, 'failed DAT load is rejected')
            load()
            assertEqual(isLoaded(), true, 'failed DAT load is retried')
            assertEqual(state.datCalls, 3, 'failed DAT attempt is not cached')
            assertEqual(state.sprCalls, 2, 'partial SPR load is not cached')

            reset({ sprResults = { false, true } })
            load()
            assertEqual(isLoaded(), false, 'failed SPR load is rejected')
            load()
            assertEqual(state.datCalls, 2, 'DAT reloads after failed SPR')
            assertEqual(state.sprCalls, 2, 'failed SPR load is retried')
          end

          local function testU32FallbackAndModernAssets()
            reset({ datResults = { false, true } })
            load()
            assertEqual(state.datCalls, 2, 'U32 DAT fallback')
            assertEqual(state.features[GameSpritesU32], true, 'U32 enabled after fallback')
            state.features = {}
            load()
            assertEqual(state.datCalls, 2, 'learned U32 mode reused')
            assertEqual(state.features[GameSpritesU32], true, 'learned U32 restored')

            reset({ modernOtfi = true })
            load()
            assertEqual(state.features[GameSpritesU32], true, 'modern U32 enabled')
            assertEqual(state.features[GameIdleAnimations], true, 'modern idle animations enabled')
            assertEqual(state.features[GameEnhancedAnimations], true, 'modern enhanced animations enabled')
          end

          testSameIdentityIsReused()
          testU16CacheIsInvalidatedForU32()
          testPathAndNativeInvalidationReload()
          testModuleAndResourceReloads()
          testFailedLoadIsNotCached()
          testU32FallbackAndModernAssets()

          print('game_things lifecycle: OK')
          LUA

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..$GITHUB_SHA"
          else
            range="$GITHUB_SHA^..$GITHUB_SHA"
          fi
          git diff --check "$range" -- . ':(exclude,glob)**/*.patch'

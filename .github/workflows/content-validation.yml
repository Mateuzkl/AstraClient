name: Content validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/content-validation.yml'
      - 'data/**'
      - 'layouts/**'
      - 'mods/**'
      - 'modules/**'
      - 'init.lua'
  pull_request:
    paths:
      - '.github/workflows/content-validation.yml'
      - 'data/**'
      - 'layouts/**'
      - 'mods/**'
      - 'modules/**'
      - 'init.lua'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit

      - name: Validate Lua syntax
        run: find modules mods data -type f -name '*.lua' -print0 | xargs -0 -I{} luajit -b '{}' /dev/null

      - name: Check whitespace
        run: git show --check --oneline --no-renames HEAD

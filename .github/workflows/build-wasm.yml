name: Build browser WebAssembly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-wasm.yml
      - browser/**
      - data/**
      - layouts/**
      - mods/**
      - modules/**
      - src/**
      - tools/check_browser_assets.py
      - tools/normalize_browser_text_assets.py
      - tools/browser_manifest.py
      - CMakeLists.txt
      - vcpkg.json
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - .github/workflows/build-wasm.yml
      - browser/**
      - data/**
      - layouts/**
      - mods/**
      - modules/**
      - src/**
      - tools/check_browser_assets.py
      - tools/normalize_browser_text_assets.py
      - tools/browser_manifest.py
      - CMakeLists.txt
      - vcpkg.json

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true

      - name: Extract bundled 8.60 assets
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip-rar
          7z x data/things/860.rar -odata/things

      - name: Cache Emscripten SDK and CMake downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.tool_cache }}/emsdk
            ${{ github.workspace }}/build-wasm-release/_deps
          key: wasm-emsdk-6.0.8-${{ hashFiles('browser/dependencies.cmake') }}

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          EMSDK_DIR="${{ runner.tool_cache }}/emsdk"
          if [[ ! -d "${EMSDK_DIR}/.git" ]]; then
            git clone --branch 6.0.8 --depth 1 https://github.com/emscripten-core/emsdk.git "${EMSDK_DIR}"
          fi
          "${EMSDK_DIR}/emsdk" install 6.0.8
          "${EMSDK_DIR}/emsdk" activate 6.0.8
          echo "${EMSDK_DIR}" >> "$GITHUB_PATH"
          echo "${EMSDK_DIR}/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${EMSDK_DIR}" >> "$GITHUB_ENV"

      - name: Build Release
        shell: bash
        run: bash browser/build-wasm.sh Release

      - name: Validate browser endpoint, cursor and persistence behavior
        run: |
          node --test browser/tests/runtime.test.cjs browser/tests/cursor.test.cjs browser/tests/asset-cache.test.cjs browser/tests/launcher.test.cjs
          python3 browser/tests/text_assets.py
          python3 browser/tests/manifest.py

      - name: Validate WebSocket teardown with the pinned SDK
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -I src browser/tests/websocket_callbacks.cpp \
            -lwebsocket.js --pre-js browser/tests/mock-websocket.js \
            -sENVIRONMENT=node -sSINGLE_FILE=1 -sASSERTIONS=1 \
            -o "${RUNNER_TEMP}/astra-websocket-test.js"
          node "${RUNNER_TEMP}/astra-websocket-test.js"

      - name: Validate browser RSA login encryption and settings compatibility
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -I src browser/tests/rsa.cpp \
            -sENVIRONMENT=node -sSINGLE_FILE=1 -sASSERTIONS=1 \
            -o "${RUNNER_TEMP}/astra-rsa-test.js"
          node "${RUNNER_TEMP}/astra-rsa-test.js"
          em++ -std=c++17 -DNDEBUG -I src browser/tests/uuid.cpp \
            -sENVIRONMENT=node -sSINGLE_FILE=1 -sASSERTIONS=1 \
            -o "${RUNNER_TEMP}/astra-uuid-test.js"
          node "${RUNNER_TEMP}/astra-uuid-test.js"

      - name: Validate independent logic timer on the application pthread
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -pthread browser/tests/logic_timer.cpp \
            -sPROXY_TO_PTHREAD=1 -sPTHREAD_POOL_SIZE=1 -sEXIT_RUNTIME=1 \
            -sENVIRONMENT=node -sASSERTIONS=1 -o "${RUNNER_TEMP}/astra-logic-timer.js"
          timeout 15 node "${RUNNER_TEMP}/astra-logic-timer.js"

      - name: Validate Fetch callback lifetimes with the pinned SDK
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -I src browser/tests/fetch_callbacks.cpp \
            --pre-js browser/tests/mock-fetch.js -sFETCH=1 -sFETCH_SUPPORT_INDEXEDDB=0 \
            -sENVIRONMENT=node -sSINGLE_FILE=1 -sASSERTIONS=1 -sSAFE_HEAP=1 \
            -o "${RUNNER_TEMP}/astra-fetch-test.js"
          node "${RUNNER_TEMP}/astra-fetch-test.js"

      - name: Validate synchronous keyboard cancellation on the browser thread
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -pthread -I src browser/tests/keyboard_callbacks.cpp \
            --pre-js browser/tests/mock-keyboard.js --pre-js browser/runtime.js \
            -sPROXY_TO_PTHREAD=1 -sPTHREAD_POOL_SIZE=1 -sEXIT_RUNTIME=1 \
            -sENVIRONMENT=node -sASSERTIONS=1 -o "${RUNNER_TEMP}/astra-keyboard-test.js"
          timeout 15 node "${RUNNER_TEMP}/astra-keyboard-test.js"

      - name: Validate queue and Lua parser ownership with sanitizers
        shell: bash
        run: |
          g++ -std=c++17 -DNDEBUG -I src -O1 -g -pthread -fsanitize=address,undefined \
            -fno-omit-frame-pointer browser/tests/message_budget.cpp \
            -o "${RUNNER_TEMP}/astra-message-budget-test"
          "${RUNNER_TEMP}/astra-message-budget-test"
          LUA_SRC=build-wasm-release/_deps/lua51_source-src/src
          mapfile -d '' LUA_SOURCES < <(find "${LUA_SRC}" -maxdepth 1 -name '*.c' ! -name lua.c ! -name luac.c ! -name print.c -print0)
          gcc -std=gnu99 -DNDEBUG -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DLUA_ANSI -I "${LUA_SRC}" -I browser/lua51 browser/tests/lua_parser.c \
            "${LUA_SOURCES[@]}" -lm -o "${RUNNER_TEMP}/astra-lua-parser-test"
          "${RUNNER_TEMP}/astra-lua-parser-test"

      - name: Validate shipped static and animated cursor images
        shell: bash
        run: |
          em++ -std=c++17 -DNDEBUG -I src browser/tests/cursor_images.cpp \
            src/framework/graphics/apngloader.cpp -sUSE_ZLIB=1 \
            --embed-file data/cursors@/data/cursors \
            -sENVIRONMENT=node -sSINGLE_FILE=1 -sASSERTIONS=1 -sSAFE_HEAP=1 \
            -o "${RUNNER_TEMP}/astra-cursor-images-test.js"
          node "${RUNNER_TEMP}/astra-cursor-images-test.js" /data/cursors

      - name: Upload browser bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astraclient-browser-${{ github.sha }}
          path: build-wasm-release/dist/
          if-no-files-found: error
          compression-level: 6

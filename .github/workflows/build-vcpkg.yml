name: Build with vcpkg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'refactor/**'

    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - vcpkg.json
      - .github/tests/native_splash.cpp
      - .github/tests/native_network.cpp
      - .github/tests/standalone_util.cpp
      - data/images/splash.png
      - data/cursors/**
      - vc23/otclient.vcxproj

  pull_request:
    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - vcpkg.json
      - .github/tests/native_splash.cpp
      - .github/tests/native_network.cpp
      - .github/tests/standalone_util.cpp
      - data/images/splash.png
      - data/cursors/**
      - vc23/otclient.vcxproj

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022

    env:
      # x-gha foi removido do vcpkg -> usar cache em pasta (files) + actions/cache.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      # sccache: cache dos objetos do codigo (so o arquivo alterado recompila)
      SCCACHE_DIR: ${{ github.workspace }}/sccache
      SCCACHE_GHA_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Get latest CMake
        uses: lukka/get-cmake@v4.3.2

      - name: Create vcpkg binary cache directory
        run: mkdir -p "${{ github.workspace }}/vcpkg_cache"
        shell: bash

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bincache-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Create sccache directory
        run: mkdir -p "${{ github.workspace }}/sccache"
        shell: bash

      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/sccache
          key: sccache-windows-${{ github.run_id }}
          restore-keys: |
            sccache-windows-

      # cmd + vcvars64: garante o ambiente MSVC completo nos subprocessos que o
      # vcpkg dispara pra buildar as portas (glew falhava com 'CMAKE_C_COMPILER not
      # set' quando o ambiente era so exportado via msvc-dev-cmd + cmake cru).
      - name: Setup MSVC, build vcpkg deps and AstraClient
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist vcpkg git clone https://github.com/microsoft/vcpkg vcpkg
          call vcpkg\bootstrap-vcpkg.bat
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      - name: Test standalone utilities and compile native networking regressions
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          mkdir build\network-test
          cl /nologo /O2 /MT /Gy /std:c++17 /EHsc /DNDEBUG /DWIN32 /DNOMINMAX /DASIO_STANDALONE /DCURL_STATICLIB /D_WIN32_WINNT=0x0601 /Isrc /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\network-test\utilities.exe /Fo:build\network-test\ .github\tests\standalone_util.cpp src\framework\stdext\string.cpp /link /OPT:REF ws2_32.lib
          if errorlevel 1 exit /b 1
          build\network-test\utilities.exe
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /std:c++17 /EHsc /DNDEBUG /DWIN32 /DNOMINMAX /DASIO_STANDALONE /DCURL_STATICLIB /D_WIN32_WINNT=0x0601 /Isrc /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\network-test\network.exe /Fo:build\network-test\ .github\tests\native_network.cpp src\framework\http\session.cpp src\framework\http\websocket.cpp /link /LIBPATH:build\vcpkg_installed\x64-windows-static\lib libcurl.lib zlib.lib libssl.lib libcrypto.lib ws2_32.lib crypt32.lib bcrypt.lib user32.lib advapi32.lib secur32.lib iphlpapi.lib
          if errorlevel 1 exit /b 1

      - name: Test Windows native splash lifecycle and resource ownership
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          mkdir build\native-splash-test\data\images
          copy /y data\images\splash.png build\native-splash-test\data\images\splash.png
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /utf-8 /std:c++17 /EHsc /DNDEBUG /DWIN32 /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\native-splash-test\native-splash-test.exe /Fo:build\native-splash-test\ .github\tests\native_splash.cpp src\framework\platform\nativesplash.cpp src\framework\graphics\apngloader.cpp /link gdiplus.lib user32.lib gdi32.lib build\vcpkg_installed\x64-windows-static\lib\zlib.lib
          if errorlevel 1 exit /b 1
          build\native-splash-test\native-splash-test.exe "%GITHUB_WORKSPACE%\data\cursors"
          if errorlevel 1 exit /b 1

      - name: Verify Windows splash packaging
        shell: pwsh
        run: |
          $source = Get-FileHash -LiteralPath data/images/splash.png
          $packaged = Get-FileHash -LiteralPath build/data/images/splash.png
          if ($source.Hash -ne $packaged.Hash) { throw 'Packaged splash does not match the source artwork.' }
          [xml]$project = Get-Content -LiteralPath vc23/otclient.vcxproj -Raw
          if (-not $project.SelectSingleNode("//*[local-name()='Target' and @Name='CopyNativeSplash']")) {
            throw 'The direct Visual Studio build must also package native splash artwork.'
          }

      # Salva mesmo em falha: as 90 deps compilam antes do erro de compile do codigo,
      # entao a proxima run as restaura e pula direto pro compile (~20min -> ~minutos).
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Save sccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/sccache
          key: sccache-windows-${{ github.run_id }}

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ github.sha }}
          path: ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
        if: ${{ failure() }}

      - name: Upload artifact binary
        uses: actions/upload-artifact@v4
        with:
          name: astraclient-windows-${{ github.sha }}
          path: |
            ${{ github.workspace }}/build/AstraClient.exe
            ${{ github.workspace }}/build/*.dll
            ${{ github.workspace }}/build/data/images/splash.png

name: Build with vcpkg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/**
      - feat/**
      - refactor/**
    paths:
      - .github/workflows/build-vcpkg.yml
      - tests/cpp23/**
      - cmake/**
      - src/**
      - tests/spectators/**
      - CMakeLists.txt
      - vcpkg.json
      - .github/tests/native_splash.cpp
      - .github/tests/native_network.cpp
      - .github/tests/native_network_fixture.cjs
      - .github/tests/standalone_util.cpp
      - data/images/splash.png
      - data/cursors/**
      - vc23/otclient.vcxproj
      - vc23/RmlUi.targets
      - tests/rmlui/**
      - tests/rendering/**
  pull_request:
    paths:
      - .github/workflows/build-vcpkg.yml
      - tests/cpp23/**
      - cmake/**
      - src/**
      - tests/spectators/**
      - CMakeLists.txt
      - vcpkg.json
      - .github/tests/native_splash.cpp
      - .github/tests/native_network.cpp
      - .github/tests/native_network_fixture.cjs
      - .github/tests/standalone_util.cpp
      - data/images/splash.png
      - data/cursors/**
      - vc23/otclient.vcxproj
      - vc23/RmlUi.targets
      - tests/rmlui/**
      - tests/rendering/**

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_LOG: warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/build/diagnostics/sccache.log
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Visual Studio GL and ANGLE settings
        shell: pwsh
        run: ./tests/rmlui/msbuild.ps1

      - name: Test live-session JSON encoding on Windows PowerShell
        shell: powershell
        run: ./tests/cpp23/Test-LiveSessionEncoding.ps1

      - name: Read build context
        shell: pwsh
        run: |
          $env:SCCACHE_DIR = Join-Path $env:RUNNER_TEMP 'sccache'
          "SCCACHE_DIR=$env:SCCACHE_DIR" >> $env:GITHUB_ENV
          & ./cmake/ci/ReadBuildContext.ps1
        id: vcpkg-baseline

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-bincache-x64-${{ steps.vcpkg-baseline.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'cmake/ci/vcpkg-tool.sha') }}
          restore-keys: |
            vcpkg-bincache-x64-${{ steps.vcpkg-baseline.outputs.toolset }}-
            vcpkg-bincache-x64-
            vcpkg-bincache-

      - name: Restore compiler objects
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: compiler-objects
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: compiler-astraclient-v1-windows-x64-${{ steps.vcpkg-baseline.outputs.toolset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-astraclient-v1-windows-x64-${{ steps.vcpkg-baseline.outputs.toolset }}-

      - name: Install verified compiler cache
        id: compiler-setup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        continue-on-error: true
        with:
          script: |
            const childEnv = { ...process.env };
            delete childEnv.ACTIONS_RUNTIME_TOKEN;
            delete childEnv.ACTIONS_RESULTS_URL;
            delete childEnv['INPUT_GITHUB-TOKEN'];
            await exec.exec('pwsh', ['-NoLogo', '-NoProfile', '-File', 'cmake/ci/SetupCompilerCache.ps1'], { env: childEnv });

      - name: Checkout pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.commit }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & ./cmake/ci/InvokeBuildStage.ps1 -Name bootstrap -Executable cmd.exe -Arguments @('/d', '/c', 'vcpkg\bootstrap-vcpkg.bat', '-disableMetrics')

      - name: Configure-CMake
        shell: pwsh
        run: |
          $commands = @'
          set "COMPILER_LAUNCHER="
          where sccache >nul 2>&1 && set "COMPILER_LAUNCHER=sccache"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DASTRA_BUILD_SPECTATOR_TESTS=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=%COMPILER_LAUNCHER% -DCMAKE_CXX_COMPILER_LAUNCHER=%COMPILER_LAUNCHER% -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'Configure-CMake' -CmdScript $commands
        id: configure

      - name: Save dependency cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.configure.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-bincache-x64-${{ steps.vcpkg-baseline.outputs.toolset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'cmake/ci/vcpkg-tool.sha') }}

      - name: Build-Release
        shell: pwsh
        run: |
          $commands = @'
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'Build-Release' -CmdScript $commands

      - name: Test native protocol frames and widget weak references
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare isolated software OpenGL for headless Windows tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          $runtime = Join-Path $env:RUNNER_TEMP 'astra-mesa-tests'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') {
            throw 'Mesa test runtime checksum mismatch.'
          }
          & 7z x $archive "-o$runtime" 'x64/opengl32.dll' 'x64/libgallium_wgl.dll' '-y'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract Mesa test runtime.' }
          "ASTRA_TEST_OPENGL_RUNTIME=$runtime\x64" >> $env:GITHUB_ENV

      - name: Test OpenGL rendering and widget lifetimes
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ./tests/rmlui/run-smoke.ps1 -Binary build/AstraClient.exe -TempRoot build/diagnostics -GraphicsRuntimeDir $env:ASTRA_TEST_OPENGL_RUNTIME
          ./tests/rmlui/run-smoke.ps1 -Binary build/AstraClient.exe -TempRoot build/diagnostics -GraphicsRuntimeDir $env:ASTRA_TEST_OPENGL_RUNTIME -Scenario skilltree

      - name: Build actual DirectX ANGLE client
        shell: pwsh
        run: |
          $commands = @'
          cmake -B build-angle -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR=%GITHUB_WORKSPACE%\build\vcpkg_installed -DOPENGLES=2.0 -DBUILD_TESTING=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-angle --target AstraClient --parallel 2
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'Build-ANGLE' -CmdScript $commands

      - name: Test DirectX ANGLE rendering and widget lifetimes
        shell: pwsh
        run: |
          ./tests/rmlui/run-smoke.ps1 -Binary build-angle/AstraClient.exe -TempRoot build/diagnostics -GraphicsBackend '-warp'
          ./tests/rmlui/run-smoke.ps1 -Binary build-angle/AstraClient.exe -TempRoot build/diagnostics -GraphicsBackend '-warp' -Scenario skilltree

      - name: test-standalone-utilities-and-native-networking
        shell: pwsh
        run: |
          $commands = @'
          if errorlevel 1 exit /b 1
          mkdir build\network-test
          cl /nologo /O2 /MT /Gy /std:c++23preview /Zc:__cplusplus /FIframework/stdext/cxx23.h /EHsc /DNDEBUG /DWIN32 /DNOMINMAX /DASIO_STANDALONE /DCURL_STATICLIB /D_WIN32_WINNT=0x0601 /Isrc /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\network-test\utilities.exe /Fo:build\network-test\ .github\tests\standalone_util.cpp src\framework\stdext\string.cpp /link /OPT:REF ws2_32.lib
          if errorlevel 1 exit /b 1
          build\network-test\utilities.exe
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /std:c++23preview /Zc:__cplusplus /FIframework/stdext/cxx23.h /EHsc /DNDEBUG /DWIN32 /DNOMINMAX /DASIO_STANDALONE /DCURL_STATICLIB /D_WIN32_WINNT=0x0601 /Isrc /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\network-test\network.exe /Fo:build\network-test\ .github\tests\native_network.cpp src\framework\http\session.cpp src\framework\http\websocket.cpp /link /LIBPATH:build\vcpkg_installed\x64-windows-static\lib libcurl.lib zlib.lib libssl.lib libcrypto.lib ws2_32.lib crypt32.lib bcrypt.lib user32.lib advapi32.lib secur32.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          node .github\tests\native_network_fixture.cjs build\network-test\network.exe build\network-test
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'test-standalone-utilities-and-native-networking' -CmdScript $commands

      - name: test-windows-native-splash-lifecycle-and-resource-ownership
        shell: pwsh
        run: |
          $commands = @'
          if errorlevel 1 exit /b 1
          mkdir build\native-splash-test\data\images
          copy /y data\images\splash.png build\native-splash-test\data\images\splash.png
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /utf-8 /std:c++23preview /Zc:__cplusplus /FIframework/stdext/cxx23.h /EHsc /DNDEBUG /DWIN32 /Isrc /Ibuild\vcpkg_installed\x64-windows-static\include /Fe:build\native-splash-test\native-splash-test.exe /Fo:build\native-splash-test\ .github\tests\native_splash.cpp src\framework\platform\nativesplash.cpp src\framework\graphics\apngloader.cpp /link gdiplus.lib user32.lib gdi32.lib build\vcpkg_installed\x64-windows-static\lib\zlib.lib
          if errorlevel 1 exit /b 1
          build\native-splash-test\native-splash-test.exe "%GITHUB_WORKSPACE%\data\cursors"
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'test-windows-native-splash-lifecycle-and-resource-ownership' -CmdScript $commands

      - name: Verify Windows splash packaging
        shell: pwsh
        run: |
          $source = Get-FileHash -LiteralPath data/images/splash.png
          $packaged = Get-FileHash -LiteralPath build/data/images/splash.png
          if ($source.Hash -ne $packaged.Hash) { throw 'Packaged splash does not match the source artwork.' }
          [xml]$project = Get-Content -LiteralPath vc23/otclient.vcxproj -Raw
          if (-not $project.SelectSingleNode("//*[local-name()='Target' and @Name='CopyNativeSplash']")) {
            throw 'The direct Visual Studio build must also package native splash artwork.'
          }

      - name: Validate-runtime-package
        shell: pwsh
        run: |
          $commands = @'
          powershell -NoProfile -ExecutionPolicy Bypass -File cmake\ci\ValidateWindowsBinary.ps1 -Executable build\AstraClient.exe
          if errorlevel 1 exit /b 1
          '@
          & ./cmake/ci/InvokeBuildStage.ps1 -Name 'Validate-runtime-package' -CmdScript $commands

      - name: Record compiler cache statistics
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            try {
              & ./cmake/ci/InvokeBuildStage.ps1 -Name compiler-cache -Executable sccache -Arguments @('--show-stats')
            } finally {
              sccache --stop-server
            }
          }
        if: always()
        continue-on-error: true

      - name: Save compiler objects
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !cancelled() && steps.compiler-setup.outcome == 'success' }}
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-objects.outputs.cache-primary-key }}

      - name: Upload build diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-diagnostics-${{ github.sha }}
          path: |
            build/diagnostics/
            build-angle/CMakeCache.txt
            build-angle/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/compile_commands.json
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/
            build/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astraclient-windows-${{ github.sha }}
          path: |
            ${{ github.workspace }}/build/AstraClient.exe
            ${{ github.workspace }}/build/*.dll
            ${{ github.workspace }}/build/data/images/splash.png
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 120

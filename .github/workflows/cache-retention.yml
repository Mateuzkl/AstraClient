name: Cache retention
on:
  workflow_run:
    workflows: ['Build with vcpkg']
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: cache-retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # No checkout, artifact download or repository code execution with this token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const caches = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.getActionsCacheList({ owner, repo, per_page: 100, page });
              caches.push(...data.actions_caches);
              if (data.actions_caches.length < 100) break;
            }
            const groups = new Map();
            for (const cache of caches) {
              const match = cache.key.match(/^(compiler-astraclient-v1-windows-x64-[0-9.]+)-[0-9]+-[0-9]+$/);
              const keep = 1;
              if (!match || !Number.isSafeInteger(cache.id) || cache.id <= 0) continue;
              const key = `${cache.ref}:${match[1]}:${keep}`;
              if (!groups.has(key)) groups.set(key, { keep, caches: [] });
              groups.get(key).caches.push(cache);
            }
            let removed = 0, bytes = 0;
            const candidates = [];
            for (const group of groups.values()) {
              group.caches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              candidates.push(...group.caches.slice(0, group.keep));
              for (const cache of group.caches.slice(group.keep)) {
                try {
                  await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                  removed++;
                  bytes += cache.size_in_bytes;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            // Bound storage across refs as well; newest snapshots win.
            candidates.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            let retainedBytes = 0;
            const maxCompilerBytes = 4 * 1024 ** 3;
            for (const cache of candidates) {
              if (retainedBytes + cache.size_in_bytes <= maxCompilerBytes) {
                retainedBytes += cache.size_in_bytes;
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                removed++;
                bytes += cache.size_in_bytes;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await core.summary.addRaw(`Removed ${removed} older generated snapshots (${bytes} bytes). Retained at most one compiler snapshot per toolset and ref, with a 4 GiB global compiler budget. Dependency caches and other cache keys were preserved.`).write();
